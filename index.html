<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de entrenamiento</title>
<meta name="description" content="Mesa para practicar One Piece Card Game contra un bot desde el móvil. Herramienta personal no oficial, sin relación con Bandai.">
<meta name="theme-color" content="#c6d6d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1a1f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url("https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&display=swap");

/* A card table, not a form: a felt mat with stitched zones, cards in real
   proportion (63:88) and only two accents: brass for you and your DON!!,
   crimson for the bot, targets and danger. The cards are the loud part;
   everything else stays quiet. */
:root {
  --mat: #c6d6d3;
  --mat-2: #b4c7c4;
  --mat-3: #a5bbb8;
  --line: #87a29e;
  --surface: #f6f8f7;
  --surface-2: #e5ecea;
  --sheet: #fbfcfb;
  --ink: #0f2126;
  --ink-2: #3f5458;
  --ink-3: #61777b;
  --edge: rgba(15, 33, 38, 0.16);
  --shadow: rgba(15, 33, 38, 0.22);
  --scrim: rgba(8, 20, 24, 0.5);
  --brass: #b57d17;
  --brass-strong: #8a5c05;
  --brass-soft: #f0e0b6;
  --on-brass: #1f1400;
  --crimson: #c22f3e;
  --crimson-soft: rgba(194, 47, 62, 0.18);
  --on-crimson: #ffffff;
  --mine-wash: rgba(181, 125, 23, 0.1);
  --bot-wash: rgba(194, 47, 62, 0.09);
  --ok: #217a4b;
  --bad: #b23a30;
  --focus: #1b5fd0;
  --paper: #f4f2ec;
  --paper-ink: #17252a;
  --back: #1c2d4e;
  --back-2: #26406b;
  --back-rule: #d4a03c;
  --c-red: #cf3f36;
  --c-green: #1f8f55;
  --c-blue: #2a6cc0;
  --c-purple: #7d45b3;
  --c-black: #2e3433;
  --c-yellow: #dcae1c;
  --font-display:
    "Barlow Condensed", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body:
    "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius: 8px;
  --gutter: 16px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mat: #0c1a1f;
    --mat-2: #11242a;
    --mat-3: #163038;
    --line: #2b4851;
    --surface: #172a30;
    --surface-2: #1e353c;
    --sheet: #13262c;
    --ink: #e4eded;
    --ink-2: #a5b8ba;
    --ink-3: #7d9294;
    --edge: rgba(228, 237, 237, 0.14);
    --shadow: rgba(0, 0, 0, 0.5);
    --scrim: rgba(0, 0, 0, 0.6);
    --brass: #e0aa42;
    --brass-strong: #f2c566;
    --brass-soft: #43350f;
    --on-brass: #1c1200;
    --crimson: #ff5f6f;
    --crimson-soft: rgba(255, 95, 111, 0.2);
    --on-crimson: #22050a;
    --mine-wash: rgba(224, 170, 66, 0.07);
    --bot-wash: rgba(255, 95, 111, 0.07);
    --ok: #4fc185;
    --bad: #f07a6e;
    --focus: #7fb0ff;
    --back-2: #2a4677;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --mat: #0c1a1f;
  --mat-2: #11242a;
  --mat-3: #163038;
  --line: #2b4851;
  --surface: #172a30;
  --surface-2: #1e353c;
  --sheet: #13262c;
  --ink: #e4eded;
  --ink-2: #a5b8ba;
  --ink-3: #7d9294;
  --edge: rgba(228, 237, 237, 0.14);
  --shadow: rgba(0, 0, 0, 0.5);
  --scrim: rgba(0, 0, 0, 0.6);
  --brass: #e0aa42;
  --brass-strong: #f2c566;
  --brass-soft: #43350f;
  --on-brass: #1c1200;
  --crimson: #ff5f6f;
  --crimson-soft: rgba(255, 95, 111, 0.2);
  --on-crimson: #22050a;
  --mine-wash: rgba(224, 170, 66, 0.07);
  --bot-wash: rgba(255, 95, 111, 0.07);
  --ok: #4fc185;
  --bad: #f07a6e;
  --focus: #7fb0ff;
  --back-2: #2a4677;
  color-scheme: dark;
}

/* ── Base ─────────────────────────────────────────────────────────────── */

html {
  height: 100%;
  box-sizing: border-box;
  background: var(--mat);
}
*,
*::before,
*::after {
  box-sizing: inherit;
}
body {
  height: 100%;
  margin: 0;
  background: var(--mat);
  color: var(--ink);
  font: 15px/1.4 var(--font-body);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
#app {
  height: 100%;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
button {
  touch-action: manipulation;
}
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
h1,
h2,
h3 {
  text-wrap: balance;
  margin: 0;
}
p {
  margin: 0;
}
.num {
  font-variant-numeric: tabular-nums;
}

.boot {
  height: 100%;
  display: grid;
  place-content: center;
  gap: 6px;
  text-align: center;
  padding-inline: var(--gutter);
}
.boot-title {
  font: 700 34px/1 var(--font-display);
}
.boot-note {
  color: var(--ink-2);
}

/* Single-column grids never grow past their container (long names, the hand strip). */
.home-head,
.section,
.continue-card,
.panel,
.sheet,
.card-text,
.action-list,
.game,
.history,
.deck-table,
.confirm-box,
.transfer,
.transfer-box,
.settings {
  grid-template-columns: minmax(0, 1fr);
}

/* ── Buttons ──────────────────────────────────────────────────────────── */

.btn {
  min-height: 44px;
  padding: 10px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--edge);
  background: var(--surface);
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
}
.btn:disabled {
  opacity: 0.5;
  cursor: default;
}
.btn-primary,
.btn-don {
  background: var(--brass);
  border-color: var(--brass-strong);
  color: var(--on-brass);
}
.btn-attack {
  background: var(--crimson);
  border-color: var(--crimson);
  color: var(--on-crimson);
  font: 700 19px/1 var(--font-display);
  letter-spacing: 0.02em;
}
.btn-danger {
  background: var(--bad);
  border-color: var(--bad);
  color: var(--on-crimson);
}
.btn-quiet {
  background: transparent;
  border-color: transparent;
  color: var(--ink-2);
}
.btn-pass {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--sheet);
  white-space: nowrap;
}
.btn-wide {
  width: 100%;
}
.icon-btn {
  min-width: 44px;
  min-height: 44px;
  border: 0;
  background: transparent;
  border-radius: var(--radius);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}
.icon-btn svg,
.btn svg {
  width: 22px;
  height: 22px;
  flex: none;
}
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.btn-row > .btn {
  flex: 1 1 130px;
}

/* ── Cards ─────────────────────────────────────────────────────────────
   .face is the printed card at any size; its parts use cqi (percent of the
   card's own width), so a 68 px tile and a full-screen zoom are the same
   design. */

.face {
  container: face / inline-size;
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 63 / 88;
  border-radius: 5.5% / 3.9%;
  overflow: hidden;
  background: var(--frame, var(--ink-3));
  box-shadow:
    0 1px 2px var(--shadow),
    0 0 0 0.5px rgba(0, 0, 0, 0.35);
}
.frame {
  position: absolute;
  inset: 0;
  color: var(--paper-ink);
}
.f-art {
  position: absolute;
  inset: 4.5cqi 4.5cqi 37% 4.5cqi;
  border-radius: 3cqi;
  background: var(--paper);
  overflow: hidden;
  display: grid;
  place-items: center;
}
.f-art::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--frame);
  opacity: 0.2;
}
.f-mono {
  position: relative;
  font: 800 34cqi/1 var(--font-display);
  letter-spacing: -0.02em;
  color: var(--paper-ink);
  opacity: 0.16;
}
.f-text {
  display: none;
  position: absolute;
  inset: 22cqi 6cqi 6cqi 6cqi;
  font: 400 6.4cqi/1.25 var(--font-body);
  color: var(--paper-ink);
  overflow: hidden;
  -webkit-line-clamp: 7;
  -webkit-box-orient: vertical;
}
.f-cost,
.f-life {
  position: absolute;
  top: 2cqi;
  left: 2cqi;
  min-width: 21cqi;
  height: 21cqi;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 800 14cqi/1 var(--font-display);
  color: #fff;
  background: var(--frame);
  border: 1.4cqi solid var(--paper);
  text-shadow: 0 0.5cqi 1cqi rgba(0, 0, 0, 0.4);
}
.f-life {
  border-radius: 4cqi 4cqi 50% 50%;
  min-width: 22cqi;
  height: 25cqi;
  align-content: center;
}
.f-life small {
  display: none;
  font: 700 5cqi/1 var(--font-body);
}
.f-power {
  position: absolute;
  top: 3cqi;
  right: 3cqi;
  padding: 0.6cqi 2.2cqi;
  border-radius: 2.5cqi;
  background: var(--paper);
  font: 800 13.5cqi/1 var(--font-display);
  letter-spacing: -0.01em;
  color: var(--paper-ink);
}
.f-counter {
  position: absolute;
  left: 0;
  top: 31%;
  padding: 2cqw 0.8cqw;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  border-radius: 0 2cqw 2cqw 0;
  background: var(--paper);
  font: 800 8.5cqw/1 var(--font-display);
  color: var(--paper-ink);
  white-space: nowrap;
}
/* Thumbnails (battle box, deck list): only frame, cost, power and name. */
@container face (max-width: 58px) {
  .f-counter,
  .f-keys,
  .f-cat {
    display: none;
  }
}
.f-keys {
  position: absolute;
  left: 4.5cqi;
  right: 4.5cqi;
  bottom: 38.5%;
  display: flex;
  flex-wrap: wrap-reverse;
  gap: 1.4cqi;
}
.f-key {
  padding: 0.8cqi 2cqi;
  border-radius: 1.6cqi;
  background: var(--paper-ink);
  color: var(--paper);
  font: 700 8cqi/1 var(--font-display);
  letter-spacing: 0.02em;
}
.f-key.k-trigger {
  background: #e3c143;
  color: #241a00;
}
.f-key.k-blocker {
  background: #2f5f8f;
  color: #fff;
}
.f-key.k-rush,
.f-key.k-rushCharacter,
.f-key.k-doubleAttack,
.f-key.k-banish {
  background: #8f2d38;
  color: #fff;
}
.k-long {
  display: none;
}
.f-plate {
  position: absolute;
  left: 4.5cqi;
  right: 4.5cqi;
  bottom: 4.5cqi;
  height: calc(37% - 9cqi);
  border-radius: 3cqi;
  background: var(--paper);
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 1cqi;
  padding-inline: 3cqi;
  text-align: center;
}
.f-name {
  font: 700 11.5cqi/1.05 var(--font-body);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}
.f-type {
  display: none;
  max-width: 100%;
  font: 400 6cqi/1.1 var(--font-body);
  color: #4a5a5e;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.f-cat {
  font: 700 6.6cqi/1 var(--font-display);
  letter-spacing: 0.06em;
  color: #59696d;
}
@container face (min-width: 96px) {
  .f-type {
    display: block;
  }
  .k-long {
    display: inline;
  }
  .k-short {
    display: none;
  }
  .f-key {
    font-size: 6.4cqi;
  }
  .f-name {
    font-size: 9.5cqi;
  }
}
@container face (min-width: 130px) {
  .f-text {
    display: -webkit-box;
  }
  .f-mono {
    display: none;
  }
  .f-life small {
    display: block;
  }
  .f-life {
    gap: 0.5cqi;
  }
}
.face-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 180ms ease;
  -webkit-touch-callout: none;
  user-select: none;
}
.face-img.loaded {
  opacity: 1;
}

/* Our own card back: navy, brass rule and an eight-point compass star. */
.face.back {
  background:
    radial-gradient(circle at 50% 50%, var(--back-2) 0 34%, transparent 70%),
    repeating-linear-gradient(45deg, transparent 0 3cqi, rgba(255, 255, 255, 0.04) 3cqi 4cqi),
    var(--back);
}
.face.back::before {
  content: "";
  position: absolute;
  inset: 5cqi;
  border: 1.4cqi solid var(--back-rule);
  border-radius: 4cqi;
  opacity: 0.85;
}
.back-mark,
.back-mark::after {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 30cqi;
  height: 30cqi;
  margin: -15cqi 0 0 -15cqi;
  border: 1.6cqi solid var(--back-rule);
}
.back-mark {
  transform: rotate(45deg);
}
.back-mark::after {
  content: "";
  left: -1.6cqi;
  top: -1.6cqi;
  margin: 0;
  transform: rotate(45deg);
}

/* Tappable card */
.card {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  border-radius: 6px;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}
.card-turn {
  display: block;
  transition:
    transform 200ms ease,
    filter 200ms ease;
}
.card.rested .card-turn {
  transform: rotate(90deg) scale(0.716);
  filter: saturate(0.7) brightness(0.9);
}
.card.can-act .face {
  box-shadow:
    0 0 0 2px var(--brass),
    0 0 12px 2px color-mix(in srgb, var(--brass) 60%, transparent);
}
.card.is-selected .face {
  box-shadow:
    0 0 0 3px var(--ink),
    0 6px 14px var(--shadow);
}
.card.is-last .face {
  outline: 2px solid var(--ink-2);
  outline-offset: 1px;
}
.card.is-battle .face {
  box-shadow:
    0 0 0 3px var(--crimson),
    0 0 14px 2px var(--crimson-soft);
}
.card.is-target .face {
  box-shadow:
    0 0 0 3px var(--crimson),
    0 0 0 7px var(--crimson-soft);
  animation: target-pulse 1.1s ease-in-out infinite;
}
.card.is-target::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 46%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 3px solid var(--crimson);
  background:
    linear-gradient(var(--crimson), var(--crimson)) center / 3px 100% no-repeat,
    linear-gradient(var(--crimson), var(--crimson)) center / 100% 3px no-repeat;
  opacity: 0.9;
  pointer-events: none;
}
.card.is-dim {
  opacity: 0.38;
}
@keyframes target-pulse {
  50% {
    box-shadow:
      0 0 0 3px var(--crimson),
      0 0 0 11px transparent;
  }
}
/* Live overlays stay upright: attached DON!! over the (irrelevant on the
   table) cost corner, current power over the printed power. */
.ov-don {
  position: absolute;
  top: -5px;
  left: -5px;
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--brass);
  color: var(--on-brass);
  font: 800 13px/1 var(--font-display);
  box-shadow: 0 1px 3px var(--shadow);
  z-index: 1;
}
.ov-power {
  position: absolute;
  right: 2px;
  top: 2px;
  padding: 2px 5px;
  border-radius: 5px;
  background: rgba(9, 20, 24, 0.84);
  color: #fff;
  font: 800 14px/1 var(--font-display);
  letter-spacing: 0.01em;
  z-index: 1;
  pointer-events: none;
}
.ov-power.up {
  background: var(--brass);
  color: var(--on-brass);
}
.ov-power.down {
  background: var(--crimson);
  color: var(--on-crimson);
}
/* A rested card is drawn sideways in the middle band of its slot. */
.card.rested .ov-power {
  top: calc(25% + 2px);
}
.card.rested .ov-don {
  top: calc(25% - 7px);
}

/* ── Home ─────────────────────────────────────────────────────────────── */

.screen {
  height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.home {
  max-width: 640px;
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.home-head {
  display: grid;
  gap: 8px;
}
.home-title {
  font: 800 clamp(34px, 11vw, 52px) / 0.92 var(--font-display);
  letter-spacing: -0.005em;
  overflow-wrap: anywhere;
}
.lede {
  color: var(--ink-2);
  max-width: 46ch;
}
.section {
  display: grid;
  gap: 12px;
}
.section-title {
  font: 700 25px/1.1 var(--font-display);
  letter-spacing: 0.01em;
}
.continue-card {
  display: grid;
  gap: 12px;
  padding: 16px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--edge);
  border-left: 4px solid var(--brass);
}
.continue-title {
  font: 700 20px/1.1 var(--font-display);
}
.continue-meta {
  color: var(--ink-2);
}
.matchup {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  padding: 18px 12px 14px;
  border-radius: 16px;
  background:
    linear-gradient(100deg, var(--mine-wash) 0 50%, var(--bot-wash) 50% 100%), var(--mat-2);
}
.matchup-side {
  display: grid;
  justify-items: center;
  gap: 8px;
}
.matchup-card {
  display: block;
  width: min(100%, 132px);
}
.matchup-side.me .matchup-card {
  transform: rotate(-4deg);
}
.matchup-side.bot .matchup-card {
  transform: rotate(4deg);
}
.matchup-who {
  padding: 2px 10px;
  border-radius: 6px;
  font: 800 15px/1.2 var(--font-display);
}
.matchup-side.me .matchup-who {
  background: var(--brass);
  color: var(--on-brass);
}
.matchup-side.bot .matchup-who {
  background: var(--crimson);
  color: var(--on-crimson);
}
.matchup-vs {
  font: 700 16px/1 var(--font-display);
  color: var(--ink-2);
}
.deck-table {
  display: grid;
  gap: 0;
  border-top: 1px solid var(--line);
}
.deck-head,
.deck-row {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 52px 52px;
  align-items: center;
  gap: 10px;
}
.deck-head {
  padding-block: 8px;
  font: 600 14px/1 var(--font-display);
  letter-spacing: 0.04em;
  color: var(--ink-2);
}
.deck-head span:nth-child(n + 3) {
  text-align: center;
}
.deck-row {
  padding-block: 8px;
  border-bottom: 1px solid var(--line);
}
.deck-leader {
  display: block;
  width: 44px;
}
.deck-text {
  min-width: 0;
}
.deck-name {
  font: 700 20px/1.05 var(--font-display);
  letter-spacing: 0.005em;
}
.deck-meta {
  font-size: 13px;
  color: var(--ink-2);
}
.deck-note {
  font-size: 12.5px;
  color: var(--bad);
  margin-top: 2px;
}
.pick {
  width: 48px;
  height: 44px;
  justify-self: center;
  border-radius: 22px;
  border: 1.5px solid var(--line);
  background: transparent;
  cursor: pointer;
  display: grid;
  place-items: center;
  font: 700 15px/1 var(--font-display);
  color: var(--ink-2);
}
.pick[aria-checked="true"] {
  background: var(--brass);
  border-color: var(--brass-strong);
  color: var(--on-brass);
}
.pick.bot[aria-checked="true"] {
  background: var(--crimson);
  border-color: var(--crimson);
  color: var(--on-crimson);
}
.history {
  display: grid;
  border-top: 1px solid var(--line);
}
.history-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 10px 4px;
  min-height: 56px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.history-main {
  display: grid;
  gap: 2px;
  min-width: 0;
}
.history-decks {
  font-weight: 700;
}
.history-meta {
  font-size: 13px;
  color: var(--ink-2);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font: 700 14px/1.2 var(--font-display);
  letter-spacing: 0.02em;
  border: 1px solid currentColor;
}
.chip-win {
  color: var(--ok);
}
.chip-loss {
  color: var(--bad);
}
.chip-live {
  color: var(--brass-strong);
}
.chip-draw {
  color: var(--ink-2);
}
.note {
  font-size: 13.5px;
  color: var(--ink-2);
}
.note-warn {
  color: var(--bad);
}
.empty {
  padding: 14px 4px;
  color: var(--ink-2);
}
.footer {
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink-3);
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.transfer,
.transfer-box,
.settings {
  display: grid;
  gap: 10px;
}
.transfer-box {
  padding: 12px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--edge);
  font-size: 14px;
}
.transfer-text {
  width: 100%;
  min-height: 88px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--edge);
  background: var(--sheet);
  font:
    12.5px/1.35 ui-monospace,
    Menlo,
    Consolas,
    monospace;
  resize: vertical;
}
.setting {
  display: grid;
  gap: 8px;
}
.setting-label {
  font-weight: 700;
  font-size: 14px;
}
.segmented {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
  gap: 6px;
}
.seg {
  min-height: 44px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  background: transparent;
  cursor: pointer;
  padding: 4px 3px;
  font: 700 15px/1.05 var(--font-display);
  overflow-wrap: anywhere;
  color: var(--ink-2);
}
.seg[aria-checked="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--sheet);
}

/* Summary */
.facts {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 6px 16px;
  margin: 0;
}
.facts dt {
  color: var(--ink-2);
}
.facts dd {
  margin: 0;
  font-weight: 700;
}
.confirm-box {
  display: grid;
  gap: 10px;
  padding: 14px;
  border-radius: 10px;
  border: 1.5px solid var(--bad);
  background: var(--surface);
}

/* ── Game screen ──────────────────────────────────────────────────────── */

.game {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  max-width: 760px;
  margin: 0 auto;
  position: relative;
}
.topbar {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 44px;
  align-items: center;
  gap: 4px;
  padding-inline: 6px;
  min-height: 50px;
}
.status {
  text-align: center;
  line-height: 1.15;
  min-width: 0;
}
.status-turn {
  font: 700 20px/1.05 var(--font-display);
  letter-spacing: 0.01em;
}
.status-turn .me {
  color: var(--brass-strong);
}
.status-turn .bot {
  color: var(--crimson);
}
.status-phase {
  font-size: 12.5px;
  color: var(--ink-2);
}

/* The mat: felt with a faint weave, stitched zones per half. */
.board {
  container: board / inline-size;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 8px 6px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 3px,
      color-mix(in srgb, var(--ink) 2.5%, transparent) 3px 4px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 3px,
      color-mix(in srgb, var(--ink) 2.5%, transparent) 3px 4px
    ),
    var(--mat);
}
.half {
  --cw: min(calc((100cqi - 52px) / 5), calc((100dvh - 410px) * 0.179));
  --gap: 5px;
  display: grid;
  grid-template-columns: repeat(5, var(--cw));
  justify-content: center;
  gap: var(--gap);
  padding: 6px;
  border-radius: 14px;
  position: relative;
}
.half-me {
  grid-template-areas:
    "ch0 ch1 ch2 ch3 ch4"
    "life trash leader stage deck"
    "don don don don don";
  background: var(--mine-wash);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brass) 30%, transparent);
}
.half-bot {
  grid-template-areas:
    "don don don don don"
    "life trash leader stage deck"
    "ch0 ch1 ch2 ch3 ch4";
  background: var(--bot-wash);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--crimson) 28%, transparent);
}
.c-ch0 {
  grid-area: ch0;
}
.c-ch1 {
  grid-area: ch1;
}
.c-ch2 {
  grid-area: ch2;
}
.c-ch3 {
  grid-area: ch3;
}
.c-ch4 {
  grid-area: ch4;
}
.c-life {
  grid-area: life;
}
.c-trash {
  grid-area: trash;
}
.c-leader {
  grid-area: leader;
}
.c-stage {
  grid-area: stage;
}
.c-deck {
  grid-area: deck;
}
.c-don {
  grid-area: don;
}
.cell {
  position: relative;
  min-width: 0;
  aspect-ratio: 63 / 88;
  display: grid;
  align-items: center;
}
.c-don {
  aspect-ratio: auto;
}
.slot-empty {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  border-radius: 6px;
  border: 1.5px dashed var(--line);
  font: 600 11px/1 var(--font-display);
  letter-spacing: 0.02em;
  color: var(--ink-3);
}

/* Piles: life (face-down stack), trash (top card face-up), deck. */
.pile {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: none;
}
.trash-pile {
  cursor: pointer;
  border-radius: 6px;
}
.pile-card {
  position: absolute;
  inset: 0;
  display: block;
}
.life-pile .pile-card {
  inset: auto;
  left: 6%;
  width: 88%;
  top: calc(var(--i) * 3%);
}
.trash-top .face {
  filter: saturate(0.55) brightness(0.88);
}
.pile-empty {
  position: absolute;
  inset: 0;
  border-radius: 6px;
  border: 1.5px dashed var(--line);
}
.pile-count {
  position: absolute;
  left: 50%;
  bottom: 3px;
  transform: translateX(-50%);
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(9, 20, 24, 0.82);
  color: #fff;
  font: 600 11px/1.1 var(--font-display);
  letter-spacing: 0.02em;
  white-space: nowrap;
  pointer-events: none;
}
.pile-count .num {
  font-size: 15px;
  font-weight: 800;
}
.life-count {
  background: var(--back);
  box-shadow: 0 0 0 1px var(--back-rule);
}
.life-count.low {
  background: var(--crimson);
  box-shadow: none;
  color: var(--on-crimson);
}

/* DON!! cost area: small cards, upright when active, sideways when rested. */
.c-don {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 26px;
  padding-inline: 2px;
}
.who {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 6px;
  font: 800 14px/1.2 var(--font-display);
  letter-spacing: 0.02em;
  white-space: nowrap;
  max-width: 34%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.who-me {
  background: var(--brass);
  color: var(--on-brass);
}
.who-bot {
  background: var(--crimson);
  color: var(--on-crimson);
}
.who-deck {
  display: none;
  font-weight: 600;
  font-size: 13px;
}
.don-row {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
}
.don {
  width: 11px;
  height: 16px;
  border-radius: 2px;
  background: linear-gradient(160deg, #f3cf72, #c58f22);
  box-shadow:
    inset 0 0 0 1px rgba(80, 50, 0, 0.45),
    0 1px 1px var(--shadow);
}
.don.rested {
  width: 16px;
  height: 11px;
  opacity: 0.45;
  margin-inline: 1px;
}
.don-text {
  flex: 1;
  min-width: 0;
  font: 700 15px/1.1 var(--font-display);
  letter-spacing: 0.01em;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hand-count {
  flex: none;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid var(--line);
  font: 700 14px/1.15 var(--font-display);
  color: var(--ink);
}

/* Middle line between the halves */
.rail {
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px 4px 12px;
  border-radius: 22px;
  background: var(--sheet);
  border: 1px solid var(--edge);
  box-shadow: 0 2px 8px var(--shadow);
  font-size: 13.5px;
  line-height: 1.25;
}
.rail-text {
  min-width: 0;
  flex: 1;
}
.rail.battle {
  border-color: var(--crimson);
}
.rail.targeting {
  border-color: var(--crimson);
  background: color-mix(in srgb, var(--crimson) 12%, var(--sheet));
}
.rail .vs {
  font: 800 17px/1 var(--font-display);
}
.rail-kind-bot {
  color: var(--crimson);
  font-weight: 700;
}
.rail-kind-me {
  color: var(--brass-strong);
  font-weight: 700;
}

/* Hand: overlapping, slightly fanned; scrolls sideways. */
.hand-wrap {
  border-top: 1px solid var(--line);
  background: linear-gradient(var(--mat-2), var(--mat));
}
.hand {
  --hw: 78px;
  display: flex;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x proximity;
  padding: 14px 16px 6px;
  scrollbar-width: none;
}
.hand::-webkit-scrollbar {
  display: none;
}
.hand-item {
  flex: 0 0 var(--hw);
  margin-left: calc(var(--hw) * -0.22);
  scroll-snap-align: start;
  transform: rotate(calc(var(--tilt) * 1deg));
  transform-origin: 50% 120%;
  position: relative;
}
.hand-item:first-child {
  margin-left: 0;
}
.hand-item:has(.is-selected) {
  z-index: 2;
}
.hand .card {
  transition: transform 160ms ease;
}
.hand .card.can-act {
  transform: translateY(-8px);
}
.hand .card.is-selected {
  transform: translateY(-12px);
}
.hand .card.is-dim {
  opacity: 0.72;
}
.hand-empty {
  color: var(--ink-2);
  padding: 22px 16px;
}

/* Action bar */
.actionbar {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 8px 12px 10px;
  background: var(--mat);
}
.actionbar-hint {
  flex: 1;
  min-width: 0;
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.25;
}
.btn-end {
  font: 700 18px/1 var(--font-display);
  letter-spacing: 0.01em;
  padding-inline: 18px;
}
.thinking {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--crimson);
  font-weight: 700;
}
.thinking::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--crimson);
  animation: blink 0.9s ease-in-out infinite alternate;
}
@keyframes blink {
  to {
    opacity: 0.2;
  }
}

/* ── Sheets ───────────────────────────────────────────────────────────── */

.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: 100%;
  max-width: 640px;
  max-height: min(88%, 780px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--sheet);
  color: var(--ink);
  border-radius: 16px 16px 0 0;
  padding: 10px var(--gutter) calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 14px;
  box-shadow: 0 -6px 24px var(--shadow);
  animation: sheet-in 180ms ease-out;
}
@keyframes sheet-in {
  from {
    transform: translateY(24px);
    opacity: 0.6;
  }
}
.sheet-grip {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--edge);
  justify-self: center;
}
.sheet-head {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.sheet-head-text {
  flex: 1;
  min-width: 0;
}
.sheet-title {
  font: 700 27px/1 var(--font-display);
  letter-spacing: 0.005em;
  overflow-wrap: anywhere;
}
.sheet-sub {
  color: var(--ink-2);
  font-size: 14px;
  margin-top: 4px;
}
.engine-text {
  font-size: 13px;
  color: var(--ink-3);
  font-style: italic;
}

/* Card sheet: big card on the left, name, facts and actions on the right. */
.card-sheet {
  display: grid;
  grid-template-columns: minmax(0, 40%) minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.cs-art {
  position: relative;
  display: block;
  padding: 0;
  border: 0;
  background: none;
  cursor: zoom-in;
  border-radius: 8px;
}
.cs-zoom {
  position: absolute;
  right: -6px;
  bottom: -6px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(9, 20, 24, 0.78);
  color: #fff;
}
.cs-zoom svg {
  width: 18px;
  height: 18px;
}
.cs-side {
  display: grid;
  gap: 12px;
  min-width: 0;
}
.cs-side .sheet-title {
  font-size: 24px;
}
.card-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.fact {
  display: inline-flex;
  gap: 5px;
  align-items: baseline;
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--surface-2);
  font-size: 13px;
}
.fact b {
  font: 700 17px/1 var(--font-display);
}
.card-text {
  display: grid;
  gap: 8px;
}
.effect {
  white-space: pre-line;
  font-size: 14.5px;
  line-height: 1.45;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--edge);
}
.effect-trigger {
  border-color: #c9a531;
}
.action-list {
  display: grid;
  gap: 8px;
}
.don-stepper {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 44px minmax(0, 1.2fr);
  gap: 8px;
  align-items: center;
  padding: 8px;
  border-radius: 12px;
  background: var(--brass-soft);
}
.don-stepper .stepper-value {
  text-align: center;
  font: 700 21px/1 var(--font-display);
}
.don-stepper .stepper-sub {
  display: block;
  font: 500 12.5px/1.2 var(--font-body);
  color: var(--ink-2);
}
.step-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--brass-strong);
  background: var(--sheet);
  font: 700 22px/1 var(--font-display);
  cursor: pointer;
}
.step-btn:disabled {
  opacity: 0.4;
}

/* Zoom: the card as big as the screen allows. */
.zoom {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(4, 10, 12, 0.88);
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  padding: 16px;
  cursor: zoom-out;
}
.zoom-card {
  width: min(92vw, calc((100dvh - 120px) * 63 / 88), 520px);
}
.zoom-card .face {
  border-radius: 4.5% / 3.2%;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
}
.zoom-close {
  min-width: 140px;
}

/* Prompt */
.battle-box {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  padding: 10px;
  border-radius: 12px;
  background: var(--surface);
  border: 1.5px solid var(--crimson);
}
.battle-box.safe {
  border-color: var(--ok);
}
.battle-side {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  grid-template-areas:
    "thumb who"
    "thumb name"
    "thumb power";
  column-gap: 8px;
  min-width: 0;
  align-items: center;
}
.battle-side.right {
  grid-template-columns: minmax(0, 1fr) 44px;
  grid-template-areas:
    "who thumb"
    "name thumb"
    "power thumb";
  text-align: right;
}
.battle-thumb {
  grid-area: thumb;
  display: block;
}
.battle-who {
  grid-area: who;
  font-size: 12px;
  color: var(--ink-3);
}
.battle-name {
  grid-area: name;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.battle-power {
  grid-area: power;
  font: 800 28px/1 var(--font-display);
}
.battle-plus {
  font-size: 15px;
  color: var(--ok);
}
.battle-vs {
  font: 700 14px/1 var(--font-display);
  color: var(--ink-3);
}
.battle-verdict {
  grid-column: 1 / -1;
  font-weight: 700;
  font-size: 14px;
  color: var(--bad);
}
.battle-box.safe .battle-verdict {
  color: var(--ok);
}
.options {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 8px;
}
.option {
  min-width: 0;
  position: relative;
  width: 100%;
  min-height: 56px;
  border-radius: 9px;
  border: 1.5px solid var(--edge);
  background: var(--surface);
  padding: 5px;
  text-align: left;
  cursor: pointer;
  display: grid;
  gap: 3px;
  align-content: start;
}
.option-card {
  display: block;
}
.option[aria-pressed="true"] {
  border-color: var(--brass-strong);
  background: var(--brass-soft);
  box-shadow: 0 0 0 2px var(--brass);
}
.option:disabled {
  opacity: 0.42;
  cursor: default;
}
.option-order {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--sheet);
  font: 700 14px/1 var(--font-display);
  z-index: 1;
}
.option-name {
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.15;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}
.option.has-card .option-name {
  -webkit-line-clamp: 1;
}
.option-meta {
  font-size: 12px;
  color: var(--ink-2);
}
.option-counter {
  position: absolute;
  left: 8px;
  top: 8px;
  z-index: 1;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--brass);
  color: var(--on-brass);
  font: 800 16px/1 var(--font-display);
  box-shadow: 0 1px 3px var(--shadow);
}
.option-detail {
  display: grid;
  gap: 6px;
}
.option-detail-name {
  font: 700 18px/1.1 var(--font-display);
}
.sheet-actions {
  position: sticky;
  bottom: calc(-16px - env(safe-area-inset-bottom, 0px));
  margin-inline: calc(var(--gutter) * -1);
  margin-bottom: calc(-16px - env(safe-area-inset-bottom, 0px));
  padding: 10px var(--gutter) calc(14px + env(safe-area-inset-bottom, 0px));
  background: var(--sheet);
  border-top: 1px solid var(--edge);
  display: grid;
  gap: 8px;
}
.validation {
  font-size: 13.5px;
  color: var(--ink-2);
}
.validation.bad {
  color: var(--bad);
}
.prompt-peek {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(100% + 8px);
  z-index: 10;
}
.peek-bar {
  width: 100%;
  min-height: 48px;
  border-radius: 10px;
  border: 1.5px solid var(--brass-strong);
  background: var(--brass-soft);
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px var(--shadow);
}

/* Setup + end panels */
.panel {
  display: grid;
  gap: 14px;
}
.panel-kicker {
  font-size: 13.5px;
  color: var(--ink-2);
}
.rps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.rps-btn {
  min-height: 108px;
  border-radius: 14px;
  border: 1.5px solid var(--edge);
  background: var(--surface);
  display: grid;
  place-items: center;
  gap: 6px;
  padding: 10px 6px;
  cursor: pointer;
  font: 700 19px/1 var(--font-display);
  letter-spacing: 0.02em;
}
.rps-btn svg {
  width: 46px;
  height: 46px;
}
.result-big {
  font: 800 58px/0.9 var(--font-display);
}
.result-big.win {
  color: var(--ok);
}
.result-big.loss {
  color: var(--bad);
}
.mull-hand {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  gap: 8px;
}

/* Log */
.log-list {
  display: grid;
  gap: 2px;
  font-size: 14px;
}
.log-line {
  padding: 4px 0;
  border-bottom: 1px solid var(--edge);
}
.log-line.turn {
  font: 700 16px/1.2 var(--font-display);
  letter-spacing: 0.02em;
  padding-top: 10px;
  border-bottom-color: var(--line);
}
.log-line.bot {
  color: var(--crimson);
}
.log-line.me {
  color: var(--brass-strong);
}
.log-line.engine {
  color: var(--ink-3);
  font-size: 12.5px;
  font-style: italic;
}
.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  font-size: 14px;
}
.toggle input {
  width: 20px;
  height: 20px;

}

.toast {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(100% + 8px);
  z-index: 15;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--sheet);
  border: 1.5px solid var(--bad);
  box-shadow: 0 6px 18px var(--shadow);
  font-size: 14px;
}
.toast p {
  flex: 1;
  min-width: 0;
}
.dock {
  position: relative;
}
.banner {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--bad);
  color: var(--bad);
  background: var(--sheet);
  font-size: 13.5px;
}

/* ── Wider screens: each half becomes one row of the real mat ────────── */
@media (min-width: 820px) {
  .game {
    max-width: 1180px;
  }
  .half {
    --cw: min(calc((100cqi - 80px) / 10), calc((100dvh - 330px) * 0.33));
    --gap: 7px;
    grid-template-columns: repeat(4, var(--cw)) 8px repeat(5, var(--cw)) 8px var(--cw);
    padding: 8px 12px;
  }
  .half-me {
    grid-template-areas:
      "life trash leader stage . ch0 ch1 ch2 ch3 ch4 . deck"
      "don don don don don don don don don don don don";
  }
  .half-bot {
    grid-template-areas:
      "don don don don don don don don don don don don"
      "life trash leader stage . ch0 ch1 ch2 ch3 ch4 . deck";
  }
  .ov-power {
    font-size: 17px;
  }
  .who-deck {
    display: inline;
  }
  .hand {
    --hw: 112px;
    justify-content: safe center;
  }
  .rail {
    align-self: center;
    width: min(100%, 720px);
  }
  .don {
    width: 14px;
    height: 20px;
  }
  .don.rested {
    width: 20px;
    height: 14px;
  }
  .sheet {
    max-width: 720px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
